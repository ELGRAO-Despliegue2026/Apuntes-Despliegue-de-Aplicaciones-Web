# Configuración básica
site_name: Apuntes Despliegue de Aplicaciones Web
site_description: Notas y apuntes de la asignatura de Despliegue de Aplicaciones Web
site_author: Carles Calatayud Trescolí

# Configuración del tema
theme:
  name: material
  language: es                          # Idioma de la interfaz (buscador, botones)
  palette:
    # Modo Claro / Oscuro alternable
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo                   # Color principal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.sections               # Secciones colapsables en la barra lateral
    - navigation.expand                 # Muestra el árbol de navegación desplegado por defecto
    - navigation.indexes                # Permite asociar una página a una sección/carpeta
    - navigation.top                    # Botón para volver arriba
    - search.suggest                    # Sugerencias automáticas en la búsqueda
    - search.highlight                  # Resalta la palabra buscada dentro del tema
    - content.code.copy                 # Botón para copiar bloques de código

# Extensiones Markdown para apuntes
markdown_extensions:
  - attr_list
  - toc
  - admonition                          # Bloques de notas, avisos y consejos (!!! note)
  - pymdownx.details                    # Bloques desplegables/colapsables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:                  # Listas de tareas con casillas [x]
      custom_checkbox: true
  - pymdownx.arithmatex:                # Soporte para fórmulas matemáticas con MathJax / LaTeX
      generic: true

# Estructura del menú de navegación (carpetas dentro de /docs)
nav:
  - Inicio: index.md
  - Recursos: recursos.md

  - UD01 - Git y Docker:
      - 1. Git:
          - Índice: UD01 - Git y Docker/1. Git/1. Git.md
          - Instalación y configuración: UD01 - Git y Docker/1. Git/2. Instalacion y configuracion.md
          - Áreas y flujo de trabajo: UD01 - Git y Docker/1. Git/3. Areas y flujo de trabajo.md
          - Ramas: UD01 - Git y Docker/1. Git/4. Ramas.md
          - Repositorio remoto: UD01 - Git y Docker/1. Git/5. Repositorio remoto.md
          - Revertir cambios: UD01 - Git y Docker/1. Git/6. Revertir cambios.md
          - Visualización del proyecto: UD01 - Git y Docker/1. Git/7. Visualizacion.md
          - Cheatsheet: UD01 - Git y Docker/1. Git/8. Cheatsheet.md
          - Arquitectura main/develop/feature: UD01 - Git y Docker/1. Git/9. Arquitectura main-dev-feature.md
      - 2. Docker: 
          - Índice: UD01 - Git y Docker/2. Docker/1. Docker.md
          - Introducción: UD01 - Git y Docker/2. Docker/2. Introducción.md
          - Instalación: UD01 - Git y Docker/2. Docker/3. Instalación.md
          - Docker Básico: UD01 - Git y Docker/2. Docker/4. Docker Básico.md

  - UD02 - Apache y Nginx:
      - Teoría:
        - Índice: UD02 - Apache y Nginx/Índice.md
        - Arquitectura Web: UD02 - Apache y Nginx/Arquitectura Web.md
        - Apache: UD02 - Apache y Nginx/Apache.md
        - Nginx: UD02 - Apache y Nginx/Nginx.md
      - Prácticas:
        - Práctica 1: UD02 - Apache y Nginx/Prácticas/Práctica 1.md
        - Práctica 2: UD02 - Apache y Nginx/Prácticas/Práctica 2.md
        - Práctica 3: UD02 - Apache y Nginx/Prácticas/Práctica 3.md

  - UD03 - Servidor de Aplicaciones:
      - Servidor de Aplicaciones: UD03 - Servidor de Aplicaciones/unidad-3-servidor-aplicaciones.md

  - UD04 - CI/CD:
      - CI/CD: UD04 - CICD/unidad-4-ci-cd.md
